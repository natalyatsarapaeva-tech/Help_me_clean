<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title data-i18n="title.collection">Collection — Point &amp; Tidy</title>
  <link rel="manifest" href="manifest.json">
  <meta name="theme-color" content="#3A5DA8">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Nunito:wght@700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="styles.css">
  <style>
    .back { text-decoration: none; color: var(--muted); font-weight: 800; }
    .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); gap: 16px; }
    .slot { padding: 10px; display: flex; flex-direction: column; gap: 8px; text-align: center; }
    .slot img { width: 100%; aspect-ratio: 3 / 4; object-fit: cover; border-radius: 12px; }
    /* Закрытый слот — силуэт, а не пустое место: видно, что коллекция продолжается. */
    .slot.locked { opacity: .75; }
    .slot.locked .shape { width: 100%; aspect-ratio: 3 / 4; border-radius: 12px; background: var(--line);
      display: flex; align-items: center; justify-content: center; font-size: 44px; color: var(--muted); }
    .slot .nm { font-weight: 800; line-height: 1.2; }
    .slot.locked .nm { color: var(--muted); }
    .bar { height: 12px; border-radius: 999px; background: var(--line); overflow: hidden; max-width: 520px; }
    .bar > i { display: block; height: 100%; background: var(--accent); transition: width .4s ease; }
  </style>
</head>
<body>
  <div class="wrap col">
    <div class="row" style="justify-content:space-between">
      <a class="back" href="index.html" data-i18n="common.back">← Back</a>
      <span class="chip" id="theme-chip">—</span>
    </div>
    <h1 id="title" data-i18n="collection.title">My collection</h1>
    <div class="row"><span class="chip" id="count">—</span></div>
    <div class="bar"><i id="bar" style="width:0%"></i></div>
    <p class="muted" id="hint"></p>
    <div id="grid" class="grid"></div>
  </div>

  <script type="module">
    import {
      initAuth, currentUid, listMyFamilies, resolveActiveFamily, getActiveFamilyId,
      listCards, getRewards, getActiveProfileId, getSettings, applyFamilyLang, applyFamilyThemes,
    } from './js/store.js';
    import { theme, cardsForTheme } from './js/family-core.js';
    import { applyThemeVars } from './js/theme-apply.js';
    import { collectionView } from './js/cards-core.js';
    import { t, applyI18n } from './js/i18n.js';

    const $ = id => document.getElementById(id);
    const esc = s => String(s ?? '').replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));

    // Витрина — той темы, в которой ребёнок сегодня («Кто ты сегодня?» на входе).
    // Сами темы придумывает родитель, поэтому образ разрешается только после
    // загрузки настроек семьи; до этого на экране пресет.
    let th = theme(sessionStorage.getItem('tidy.todayTheme'));
    applyThemeVars(th);
    applyI18n();

    (async () => {
      const user = await initAuth();
      if (!user || !currentUid()) { location.href = 'index.html'; return; }
      const families = await listMyFamilies();
      const fid = resolveActiveFamily(families) || getActiveFamilyId();
      const profileId = getActiveProfileId();
      if (!profileId) { location.href = 'index.html'; return; }
      const settings = await getSettings(fid).catch(() => null);
      applyFamilyLang(settings); applyFamilyThemes(settings); applyI18n();
      th = theme(sessionStorage.getItem('tidy.todayTheme'));
      applyThemeVars(th);
      $('theme-chip').textContent = `${th.currencyEmoji} ${th.label}`;

      const [catalog, rewards] = await Promise.all([
        listCards(fid).catch(() => []),
        getRewards(fid, profileId).catch(() => null),
      ]);
      const owned = cardsForTheme(rewards || {}, th.id);
      const v = collectionView(catalog, th.id, owned);

      $('count').textContent = v.total ? t('collection.count', { got: v.got, total: v.total }) : t('collection.none');
      $('bar').style.width = `${v.total ? Math.round((v.got / v.total) * 100) : 0}%`;
      $('hint').textContent = t(!v.total ? 'collection.hintNone'
        : v.complete ? 'collection.hintComplete' : 'collection.hintMore');

      $('grid').innerHTML = v.cards.map(c => c.owned
        ? `<div class="card slot"><img src="${esc(c.url)}" alt=""><div class="nm">${esc(c.name || '')}</div></div>`
        : `<div class="card slot locked"><div class="shape">?</div><div class="nm">${esc(t('collection.locked'))}</div></div>`).join('');
    })();
  </script>
  <script src="pwa.js"></script>
</body>
</html>
