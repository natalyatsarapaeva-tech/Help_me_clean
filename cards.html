<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title data-i18n="title.cards">Cards — Point &amp; Tidy</title>
  <link rel="manifest" href="manifest.json">
  <meta name="theme-color" content="#3A5DA8">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Nunito:wght@700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="styles.css">
  <style>
    .back { text-decoration: none; color: var(--muted); font-weight: 800; }
    .step { display: none; }
    .step.on { display: block; }
    .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(170px, 1fr)); gap: 16px; }
    .card-tile { padding: 10px; display: flex; flex-direction: column; gap: 8px; }
    .card-tile img { width: 100%; aspect-ratio: 3 / 4; object-fit: cover; border-radius: 12px; background: var(--line); }
    .card-tile .nm { font-weight: 800; line-height: 1.2; }
    .card-tile .btn { min-height: 44px; padding: 0 12px; font-size: 15px; }
    .frame { position: relative; border-radius: var(--radius); overflow: hidden; background: #000; line-height: 0; max-width: 720px; }
    .frame video, .frame img { display: block; width: 100%; max-height: 56vh; object-fit: contain; background: #000; }
    .shutter { position: absolute; left: 50%; bottom: 16px; transform: translateX(-50%); width: 84px; height: 84px;
      border-radius: 50%; border: 6px solid #fff; background: rgba(255,255,255,.28); cursor: pointer; box-shadow: 0 6px 20px rgba(0,0,0,.4); }
    .theme-pick { display: flex; gap: 10px; flex-wrap: wrap; }
    .theme-pick .btn.on { outline: 4px solid var(--accent); }
  </style>
</head>
<body>
  <div class="wrap col">
    <a class="back" href="index.html" data-i18n="common.back">← Back</a>
    <h1 data-i18n="cards.title">Collection cards</h1>

    <!-- Каталог семьи. -->
    <section id="step-list" class="step on col">
      <p class="muted" data-i18n="cards.intro"></p>
      <div class="row">
        <span class="chip" id="summary">—</span>
        <button class="btn btn-primary" id="btn-add" style="margin-left:auto" data-i18n="cards.add">+ Add a card</button>
      </div>
      <div id="grid" class="grid"></div>
      <p class="muted hidden" id="empty" data-i18n="cards.empty"></p>
    </section>

    <!-- Съёмка / выбор файла. -->
    <section id="step-shoot" class="step col">
      <h1 data-i18n="cards.newTitle">New card</h1>
      <p class="muted" data-i18n="cards.newHint">Photograph the sticker or the drawing.</p>
      <div class="frame" id="frame">
        <video id="video" playsinline muted></video>
        <button class="shutter" id="btn-shot" data-i18n-aria-label="cards.shoot" aria-label="Take a photo"></button>
      </div>
      <div class="row">
        <label class="btn btn-ghost" style="max-width:320px">
          <span data-i18n="cards.pickFile">🖼 Choose a file</span>
          <input id="file-input" type="file" accept="image/*" hidden>
        </label>
        <span class="muted" id="cam-error"></span>
      </div>
      <button class="btn btn-ghost" id="btn-cancel" style="max-width:240px" data-i18n="common.backToList">← Back to list</button>
    </section>

    <!-- Подпись и образ. -->
    <section id="step-meta" class="step col">
      <h1 data-i18n="cards.metaTitle">What is it called?</h1>
      <div class="row" style="align-items:flex-start">
        <div class="frame" style="max-width:280px"><img id="preview" alt=""></div>
        <div class="col" style="flex:1;min-width:260px">
          <input id="card-name" class="field" data-i18n-placeholder="cards.namePlaceholder" placeholder="" maxlength="40">
          <div class="muted" data-i18n="cards.whichTheme">Which character does it drop for?</div>
          <div class="theme-pick" id="theme-pick"></div>
          <div class="row">
            <button class="btn btn-primary" id="btn-save" data-i18n="common.save">Save</button>
            <button class="btn btn-ghost" id="btn-retake" data-i18n="cards.anotherPhoto">Another photo</button>
          </div>
        </div>
      </div>
    </section>

    <div id="toast" class="toast"></div>
  </div>

  <script type="module">
    import {
      initAuth, currentUid, listMyFamilies, resolveActiveFamily, getActiveFamilyId,
      listCards, saveCard, deleteCard, getSettings, isParentUnlocked, applyFamilyLang,
    } from './js/store.js';
    import { parentAreaLocked } from './js/profile-core.js';
    import { startCamera, stopCamera, cameraErrorText } from './js/camera.js';
    import { compressCard } from './js/image.js';
    import { theme, THEME_IDS } from './js/family-core.js';
    import { CARD_ANY, normalizeCatalog, catalogSummary, makeCardId } from './js/cards-core.js';
    import { t, applyI18n } from './js/i18n.js';

    const $ = id => document.getElementById(id);
    const esc = s => String(s ?? '').replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
    const STEPS = ['step-list', 'step-shoot', 'step-meta'];
    const show = id => STEPS.forEach(s => $(s).classList.toggle('on', s === id));
    let toastTimer;
    const toast = (m) => { const el = $('toast'); el.textContent = m; el.classList.add('on'); clearTimeout(toastTimer); toastTimer = setTimeout(() => el.classList.remove('on'), 2600); };
    applyI18n();

    // Подписи образов зависят от языка — считаем их функцией, а не константой.
    const themeLabels = () => ({
      [CARD_ANY]: t('cards.forBoth'),
      ...Object.fromEntries(THEME_IDS.map(id => [id, `${theme(id).currencyEmoji} ${theme(id).label}`])),
    });
    let fid = null, cards = [], shot = null, pickedTheme = CARD_ANY;

    function renderList() {
      const s = catalogSummary(cards);
      const labels = themeLabels();
      $('summary').textContent = s.total
        ? t('cards.summary', {
            total: s.total,
            byTheme: THEME_IDS.map(id => `${theme(id).label}: ${s.byTheme[id]}`).join(' · '),
            any: s.byTheme[CARD_ANY],
          })
        : t('cards.none');
      $('empty').classList.toggle('hidden', !!s.total);
      $('grid').innerHTML = normalizeCatalog(cards).map(c => `
        <div class="card card-tile" data-card="${esc(c.id)}">
          <img src="${esc(c.url)}" alt="">
          <div class="nm">${esc(c.name || t('cards.unnamed'))}</div>
          <div class="muted" style="font-size:14px">${esc(labels[c.theme] || c.theme)}</div>
          <button class="btn btn-ghost drop">${esc(t('common.delete'))}</button>
        </div>`).join('');
      $('grid').querySelectorAll('[data-card]').forEach(el => {
        const id = el.dataset.card;
        el.querySelector('.drop').onclick = async () => {
          if (!confirm(t('cards.confirmDelete'))) return;
          try {
            await deleteCard(fid, id);
            cards = cards.filter(c => c.id !== id);
            renderList();
            toast(t('cards.deleted'));
          } catch (e) { console.error(e); toast(t('cards.deleteFailed')); }
        };
      });
    }

    function renderThemePick() {
      const labels = themeLabels();
      $('theme-pick').innerHTML = [CARD_ANY, ...THEME_IDS].map(id => `
        <button class="btn btn-ghost ${id === pickedTheme ? 'on' : ''}" data-theme="${id}">${esc(labels[id])}</button>`).join('');
      $('theme-pick').querySelectorAll('[data-theme]').forEach(el => {
        el.onclick = () => { pickedTheme = el.dataset.theme; renderThemePick(); };
      });
    }

    async function goShoot() {
      show('step-shoot');
      try {
        await startCamera($('video'));
        $('frame').style.display = '';
        $('cam-error').textContent = '';
      } catch (e) {
        $('frame').style.display = 'none';
        $('cam-error').textContent = cameraErrorText(e);
      }
    }

    async function capture(source) {
      try {
        dropShot();
        shot = await compressCard(source);
        stopCamera();
        $('preview').src = shot.url;
        renderThemePick();
        show('step-meta');
        $('card-name').focus();
      } catch (e) { console.error(e); toast(t('cards.captureFailed')); }
    }
    function dropShot() { if (shot?.url) URL.revokeObjectURL(shot.url); shot = null; }

    $('btn-add').onclick = () => { pickedTheme = CARD_ANY; $('card-name').value = ''; goShoot(); };
    $('btn-shot').onclick = () => capture($('video'));
    $('file-input').onchange = e => { const f = e.target.files?.[0]; if (f) capture(f); e.target.value = ''; };
    $('btn-cancel').onclick = () => { stopCamera(); dropShot(); show('step-list'); };
    $('btn-retake').onclick = () => { dropShot(); goShoot(); };
    $('btn-save').onclick = async () => {
      if (!shot) return;
      const name = $('card-name').value.trim();
      if (!name) { toast(t('cards.needName')); $('card-name').focus(); return; }
      $('btn-save').disabled = true;
      try {
        const id = makeCardId(name);
        const saved = await saveCard(fid, id, shot.blob, { name, theme: pickedTheme, w: shot.w, h: shot.h });
        cards = [...cards, saved];
        dropShot();
        renderList();
        show('step-list');
        toast(t('cards.added'));
      } catch (e) {
        console.error(e);
        toast(t(e?.code === 'storage/unauthorized' ? 'cards.storageDenied' : 'house.saveFailed'));
      } finally { $('btn-save').disabled = false; }
    };

    // ── Старт: только для родителя ──
    (async () => {
      const user = await initAuth();
      if (!user || !currentUid()) { location.href = 'index.html'; return; }
      const families = await listMyFamilies();
      fid = resolveActiveFamily(families) || getActiveFamilyId();
      // Родительская часть под кодом: если он задан, а в этой сессии его не
      // вводили — отправляем на главную, там спросят. Замок от ребёнка, не от взлома.
      const settings = await getSettings(fid).catch(() => null);
      applyFamilyLang(settings); applyI18n();
      if (parentAreaLocked(settings) && !isParentUnlocked()) { location.href = 'index.html'; return; }
      try { cards = await listCards(fid); } catch (e) { console.warn('cards:', e); }
      renderList();
    })();
  </script>
  <script src="pwa.js"></script>
</body>
</html>
