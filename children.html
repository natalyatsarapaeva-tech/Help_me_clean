<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title data-i18n="title.children">Children — Point &amp; Tidy</title>
  <link rel="manifest" href="manifest.json">
  <meta name="theme-color" content="#3A5DA8">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Nunito:wght@700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="styles.css">
  <style>
    .back { text-decoration: none; color: var(--muted); font-weight: 800; }
    .kid { display: grid; grid-template-columns: 56px 1fr auto; gap: 12px; align-items: center; }
    .kid .face { font-size: 34px; text-align: center; }
    .kid .btn { min-height: 48px; padding: 0 14px; font-size: 15px; }
    .form-grid { display: grid; grid-template-columns: 80px 1fr 160px; gap: 12px; align-items: center; }
    .form-grid .emoji { text-align: center; font-size: 26px; }
    .pin-field { letter-spacing: 8px; text-align: center; }
    @media (max-width: 620px) { .form-grid { grid-template-columns: 80px 1fr; } .kid { grid-template-columns: 56px 1fr; } }
  </style>
</head>
<body>
  <div class="wrap col">
    <a class="back" href="index.html" data-i18n="common.back">← Back</a>
    <h1 data-i18n="children.title">Children</h1>
    <p class="muted" data-i18n="children.intro">A profile is just a name and an avatar on this tablet.</p>

    <div class="card col">
      <strong data-i18n="children.listTitle">Profiles</strong>
      <div id="kids" class="col muted" data-i18n="common.loading">Loading…</div>
    </div>

    <section class="card col">
      <strong data-i18n="children.addTitle">Add a child</strong>
      <div class="form-grid">
        <input id="f-avatar" class="field emoji" value="🧒" maxlength="2" data-i18n-title="children.avatarTitle" title="Avatar">
        <input id="f-name" class="field" data-i18n-placeholder="children.namePlaceholder" placeholder="Name">
        <input id="f-pin" class="field pin-field" inputmode="numeric" maxlength="4" data-i18n-placeholder="children.pinPlaceholder" placeholder="Code (optional)">
      </div>
      <p class="muted" style="font-size:14px" data-i18n="children.addNote">
        Who to be the child picks at every sign-in.
      </p>
      <button id="btn-create" class="btn btn-primary" data-i18n="common.add">Add</button>
    </section>

    <div id="toast" class="toast"></div>
  </div>

  <script type="module">
    import {
      initAuth, currentUid, listMyFamilies, resolveActiveFamily, getActiveFamilyId,
      listProfiles, createChildProfile, setProfilePin, deleteProfile,
      getSettings, isParentUnlocked, applyFamilyLang, applyFamilyThemes,
    } from './js/store.js';
    import { theme } from './js/family-core.js';
    import { normalizeProfiles, isLocked, parentAreaLocked } from './js/profile-core.js';
    import { isValidPin } from './js/pin.js';
    import { t, applyI18n } from './js/i18n.js';

    const $ = id => document.getElementById(id);
    const esc = s => String(s ?? '').replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
    let toastTimer;
    const toast = (m) => { const el = $('toast'); el.textContent = m; el.classList.add('on'); clearTimeout(toastTimer); toastTimer = setTimeout(() => el.classList.remove('on'), 2600); };
    applyI18n();

    let fid = null, kids = [];

    function renderKids() {
      if (!kids.length) { $('kids').textContent = t('children.empty'); return; }
      $('kids').innerHTML = kids.map(k => `
        <div class="kid" data-id="${esc(k.id)}">
          <span class="face">${esc(k.avatar || '🧒')}</span>
          <span>
            <strong>${esc(k.name || t('profiles.child'))}</strong>
            <span class="muted" style="font-size:14px">
              — ${esc(isLocked(k) ? t('profiles.locked') : t('profiles.open'))}${k.lastTheme ? esc(t('children.lastTime', { theme: theme(k.lastTheme).label })) : ''}
            </span>
          </span>
          <span class="row">
            <button class="btn btn-ghost pin">${esc(t(isLocked(k) ? 'children.changePin' : 'children.setPin'))}</button>
            ${isLocked(k) ? `<button class="btn btn-ghost unpin">${esc(t('children.clearPin'))}</button>` : ''}
            <button class="btn btn-ghost drop">${esc(t('common.delete'))}</button>
          </span>
        </div>`).join('');

      $('kids').querySelectorAll('[data-id]').forEach(el => {
        const id = el.dataset.id;
        const kid = kids.find(k => k.id === id);
        el.querySelector('.pin').onclick = async () => {
          const pin = prompt(t('children.promptPin', { name: kid.name }));
          if (pin === null) return;
          if (!isValidPin(pin.trim())) { toast(t('children.pinExactly4')); return; }
          try {
            await setProfilePin(fid, id, pin.trim());
            await reload();
            toast(t('children.pinSaved'));
          } catch (e) { console.error(e); toast(t('children.pinSaveFailed')); }
        };
        const unpin = el.querySelector('.unpin');
        if (unpin) unpin.onclick = async () => {
          if (!confirm(t('children.confirmClearPin', { name: kid.name }))) return;
          try { await setProfilePin(fid, id, null); await reload(); toast(t('children.pinCleared')); }
          catch (e) { console.error(e); toast(t('children.pinClearFailed')); }
        };
        el.querySelector('.drop').onclick = async () => {
          if (!confirm(t('children.confirmDelete', { name: kid.name }))) return;
          try { await deleteProfile(fid, id); await reload(); toast(t('children.deleted')); }
          catch (e) { console.error(e); toast(t('children.deleteFailed')); }
        };
      });
    }

    async function reload() {
      kids = normalizeProfiles(await listProfiles(fid));
      renderKids();
    }

    $('btn-create').onclick = async () => {
      const name = $('f-name').value.trim();
      const avatar = $('f-avatar').value.trim() || '🧒';
      const pin = $('f-pin').value.trim();
      if (!name) { toast(t('children.needName')); return; }
      if (pin && !isValidPin(pin)) { toast(t('children.pinExactly4OrEmpty')); return; }
      $('btn-create').disabled = true;
      try {
        await createChildProfile(fid, { name, avatar, pin: pin || null });
        $('f-name').value = ''; $('f-pin').value = ''; $('f-avatar').value = '🧒';
        await reload();
        toast(t('children.added', { name }));
      } catch (e) { console.error(e); toast(t('children.addFailed')); }
      finally { $('btn-create').disabled = false; }
    };

    // ── Старт: родительская часть ──
    (async () => {
      const user = await initAuth();
      if (!user || !currentUid()) { location.href = 'index.html'; return; }
      const families = await listMyFamilies();
      fid = resolveActiveFamily(families) || getActiveFamilyId();
      // Замок родительской части: если код задан, а его в этой сессии не вводили —
      // отправляем на главную, где спросят. Это защита от ребёнка, а не от взлома.
      const settings = await getSettings(fid).catch(() => null);
      // Темы семьи — до отрисовки списка: в строке ребёнка стоит подпись образа,
      // которым он был в прошлый раз, а имена образов придумывает родитель.
      applyFamilyLang(settings); applyFamilyThemes(settings); applyI18n();
      if (parentAreaLocked(settings) && !isParentUnlocked()) { location.href = 'index.html'; return; }
      await reload();
    })();
  </script>
  <script src="pwa.js"></script>
</body>
</html>
