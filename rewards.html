<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title data-i18n="title.rewards">Rewards — Point &amp; Tidy</title>
  <link rel="manifest" href="manifest.json">
  <meta name="theme-color" content="#3A5DA8">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Nunito:wght@700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="styles.css">
  <style>
    .back { text-decoration: none; color: var(--muted); font-weight: 800; }
    .reward-row { display: grid; grid-template-columns: 64px 1fr 120px auto; gap: 12px; align-items: center; }
    .reward-row .emoji { text-align: center; font-size: 30px; }
    /* Фото награды вместо эмодзи: настоящее мороженое мотивирует сильнее. */
    .thumb { width: 64px; height: 64px; border-radius: 14px; object-fit: cover; background: var(--line); display: block; }
    .pick-photo { position: relative; display: inline-flex; align-items: center; justify-content: center;
      width: 90px; height: 64px; border-radius: 14px; border: 2px dashed var(--line); cursor: pointer;
      font-size: 26px; overflow: hidden; background: var(--card); }
    .pick-photo img { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; }
    .pick-photo .cap { position: absolute; left: 0; right: 0; bottom: 0; font-size: 11px; font-weight: 800;
      background: rgba(0,0,0,.55); color: #fff; text-align: center; padding: 2px 0; }
    .reward-row .btn { min-height: 52px; padding: 0 16px; }
    .add-row { display: grid; grid-template-columns: 90px 1fr 140px auto; gap: 12px; align-items: center; }
    .queue-row { display: grid; grid-template-columns: 1fr auto; gap: 12px; align-items: center; }
    .queue-row .btn { min-height: 52px; }
    @media (max-width: 720px) { .reward-row, .add-row { grid-template-columns: 64px 1fr; } .reward-row .btn, .add-row .btn { grid-column: 1 / -1; } }
  </style>
</head>
<body>
  <div class="wrap col">
    <a class="back" href="index.html" data-i18n="common.back">← Back</a>
    <h1 data-i18n="rewards.title">Real rewards</h1>
    <p class="muted" data-i18n-html="rewards.intro"></p>

    <!-- Очередь: что дети купили и ждут. -->
    <section class="card col" id="queue-box">
      <strong data-i18n="rewards.queueTitle">Waiting to be handed over</strong>
      <div id="queue" class="col"></div>
    </section>

    <!-- Витрина. -->
    <section class="card col">
      <strong data-i18n="rewards.shopTitle">What can be bought</strong>
      <div id="list" class="col"></div>
      <div class="add-row">
        <!-- Эмодзи или фото — одно место в форме: фото перекрывает эмодзи,
             «Убрать фото» возвращает его обратно. -->
        <label class="pick-photo" id="pick-photo" data-i18n-title="rewards.photoTitle" title="Upload a photo of the reward">
          <span id="new-emoji-view">🍦</span>
          <img id="new-photo" alt="" hidden>
          <span class="cap" data-i18n="rewards.photoCap">📷 photo</span>
          <input id="photo-input" type="file" accept="image/*" hidden>
        </label>
        <input id="new-name" class="field" data-i18n-placeholder="rewards.namePlaceholder" placeholder="" maxlength="40">
        <input id="new-cost" class="field" type="number" min="1" step="1" data-i18n-placeholder="rewards.costPlaceholder" placeholder="">
        <button id="btn-add" class="btn btn-primary" disabled data-i18n="rewards.uploading">Loading…</button>
      </div>
      <div class="row" style="gap:10px;align-items:center">
        <input id="new-emoji" class="field" value="🍦" maxlength="4" style="width:80px;text-align:center">
        <span class="muted" style="font-size:14px" data-i18n="rewards.emojiHint">emoji — if there is no photo</span>
        <button class="btn btn-ghost hidden" id="btn-drop-photo" style="min-height:44px" data-i18n="rewards.dropPhoto">Remove photo</button>
      </div>
      <!-- Что именно пошло не так: «не удалось сохранить» родителю ничего не
           говорит, а причина почти всегда одна и чинится за минуту. -->
      <div id="err" class="card hidden" style="border:2px solid #E53935;font-size:14px"></div>
      <div class="muted" style="font-size:14px" data-i18n="rewards.pricingHint"></div>
    </section>

    <div id="toast" class="toast"></div>
  </div>

  <script type="module">
    import {
      initAuth, currentUid, listMyFamilies, resolveActiveFamily, getActiveFamilyId,
      listRealRewards, saveRealReward, deleteRealReward, listAllRewards, saveRewards,
      getSettings, isParentUnlocked, applyFamilyLang,
    } from './js/store.js';
    import { parentAreaLocked } from './js/profile-core.js';
    import { normalizeShop, makeRewardId, pendingPurchases, markGiven } from './js/shop-core.js';
    import { compressCard } from './js/image.js';
    import { t, applyI18n } from './js/i18n.js';

    const $ = id => document.getElementById(id);
    const esc = s => String(s ?? '').replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
    let toastTimer;
    const toast = (m) => { const el = $('toast'); el.textContent = m; el.classList.add('on'); clearTimeout(toastTimer); toastTimer = setTimeout(() => el.classList.remove('on'), 2600); };
    applyI18n();

    let fid = null, shop = [], children = [];
    // Выбранное, но ещё не сохранённое фото новой награды: {blob, url, w, h}.
    let photo = null;
    // Форма живёт с момента загрузки разметки, а fid приезжает после трёх
    // запросов в сеть. Родитель успевал вписать награду и нажать «Добавить»
    // раньше — и запись уходила в families/null: Firestore отвечал ошибкой,
    // а экран показывал безликое «Не удалось сохранить» и пустую витрину.
    let ready = false;
    function setReady(on) {
      ready = on;
      $('btn-add').disabled = !on;
      $('btn-add').textContent = t(on ? 'common.add' : 'rewards.uploading');
    }

    // Ошибку показываем как есть: код Firestore — единственное, по чему
    // понятно, чинить правила, связь или что-то третье.
    function showError(where, e) {
      const code = e?.code || e?.name || '';
      const hint = code === 'storage/unauthorized' ? t('rewards.errStorage')
        : code === 'permission-denied' ? t('rewards.errRules')
        : (code === 'unavailable' ? t('rewards.errOffline') : '');
      $('err').innerHTML = `<strong>${esc(where)}</strong><br>${esc(code || t('rewards.errGeneric'))}: ${esc(e?.message || e)}${hint ? `<br><br>${esc(hint)}` : ''}`;
      $('err').classList.remove('hidden');
    }
    const clearError = () => $('err').classList.add('hidden');

    // Фото сжимаем до 900px — витрину смотрят в сетке на планшете, а не печатают
    // (тот же размер, что у карточек коллекции).
    function dropPhoto() {
      if (photo?.url) URL.revokeObjectURL(photo.url);
      photo = null;
      $('new-photo').hidden = true;
      $('new-photo').removeAttribute('src');
      $('new-emoji-view').hidden = false;
      $('btn-drop-photo').classList.add('hidden');
    }
    $('photo-input').onchange = async (e) => {
      const file = e.target.files?.[0];
      e.target.value = '';
      if (!file) return;
      clearError();
      try {
        const pic = await compressCard(file);
        dropPhoto();
        photo = pic;
        $('new-photo').src = pic.url;
        $('new-photo').hidden = false;
        $('new-emoji-view').hidden = true;
        $('btn-drop-photo').classList.remove('hidden');
      } catch (err) { console.error(err); toast(t('rewards.fileFailed')); }
    };
    $('btn-drop-photo').onclick = dropPhoto;
    $('new-emoji').oninput = () => { $('new-emoji-view').textContent = $('new-emoji').value.trim() || '🎁'; };

    function renderShop() {
      const items = normalizeShop(shop);
      $('list').innerHTML = items.map(it => `
        <div class="reward-row" data-reward="${esc(it.id)}">
          <div class="emoji">${it.url
            ? `<img class="thumb" src="${esc(it.url)}" alt="${esc(it.name)}">`
            : esc(it.emoji)}</div>
          <div><strong>${esc(it.name)}</strong></div>
          <div class="chip">✨ ${it.cost}</div>
          <div class="row" style="gap:8px">
            <label class="btn btn-ghost" style="min-height:52px">${esc(t(it.url ? 'rewards.otherPhoto' : 'rewards.photo'))}
              <input type="file" accept="image/*" class="repic" hidden>
            </label>
            <button class="btn btn-ghost drop">${esc(t('common.remove'))}</button>
          </div>
        </div>`).join('') || `<div class="muted">${esc(t('rewards.shopEmpty'))}</div>`;
      $('list').querySelectorAll('[data-reward]').forEach(el => {
        // Фото у уже заведённой награды: заменить проще, чем удалять и создавать
        // заново (цена и название остались бы прежними — терять их незачем).
        el.querySelector('.repic').onchange = async (e) => {
          const file = e.target.files?.[0]; e.target.value = '';
          if (!file) return;
          const it = normalizeShop(shop).find(x => x.id === el.dataset.reward);
          if (!it) return;
          clearError();
          try {
            const pic = await compressCard(file);
            const saved = await saveRealReward(fid, it.id, { ...it }, pic.blob);
            URL.revokeObjectURL(pic.url);
            shop = shop.map(x => (x.id === it.id ? { ...x, ...saved } : x));
            renderShop();
            toast(t('rewards.photoUpdated'));
          } catch (err) { console.error(err); toast(t('rewards.photoFailed')); showError(t('rewards.photoFailedWhere'), err); }
        };
        el.querySelector('.drop').onclick = async () => {
          const id = el.dataset.reward;
          if (!confirm(t('rewards.confirmDelete'))) return;
          try {
            await deleteRealReward(fid, id);
            shop = shop.filter(x => x.id !== id);
            renderShop();
            toast(t('rewards.removed'));
          } catch (e) { console.error(e); toast(t('rewards.removeFailed')); showError(t('rewards.removeFailedWhere'), e); }
        };
      });
    }

    // Очередь выдачи: покупки живут в наградах каждого ребёнка.
    function renderQueue() {
      const rows = [];
      for (const { profile, rewards } of children) {
        for (const p of pendingPurchases(rewards)) {
          rows.push(`
            <div class="queue-row" data-child="${esc(profile.id)}" data-purchase="${esc(p.id)}">
              <div class="row" style="gap:10px">
                ${p.url ? `<img class="thumb" style="width:44px;height:44px" src="${esc(p.url)}" alt="">`
                        : `<span style="font-size:26px">${esc(p.emoji || '🎁')}</span>`}
                <div><strong>${esc(p.name)}</strong>
                  <span class="muted">${esc(t('rewards.forChild', { name: profile.name || profile.id, cost: p.cost }))}</span></div>
              </div>
              <button class="btn btn-primary give">${esc(t('rewards.give'))}</button>
            </div>`);
        }
      }
      $('queue').innerHTML = rows.join('') || `<div class="muted">${esc(t('rewards.queueEmpty'))}</div>`;
      $('queue').querySelectorAll('[data-purchase]').forEach(el => {
        el.querySelector('.give').onclick = async () => {
          const childId = el.dataset.child, purchaseId = el.dataset.purchase;
          const entry = children.find(c => c.profile.id === childId);
          if (!entry) return;
          el.querySelector('.give').disabled = true;
          try {
            const next = markGiven(entry.rewards, purchaseId);
            await saveRewards(fid, childId, next);
            entry.rewards = next;
            renderQueue();
            toast(t('rewards.given'));
          } catch (e) {
            console.error(e); toast(t('rewards.giveFailed'));
            showError(t('rewards.giveFailedWhere'), e);
            el.querySelector('.give').disabled = false;
          }
        };
      });
    }

    $('btn-add').onclick = async () => {
      if (!ready || !fid) { toast(t('rewards.stillLoading')); return; }
      clearError();
      const name = $('new-name').value.trim();
      const cost = parseInt($('new-cost').value, 10);
      const emoji = $('new-emoji').value.trim() || '🎁';
      if (!name) { toast(t('rewards.needName')); $('new-name').focus(); return; }
      if (!Number.isFinite(cost) || cost < 1) { toast(t('rewards.needCost')); $('new-cost').focus(); return; }
      $('btn-add').disabled = true;
      try {
        const saved = await saveRealReward(
          fid, makeRewardId(name),
          { name, cost, emoji, w: photo?.w || null, h: photo?.h || null },
          photo?.blob || null,
        );
        shop = [...shop, saved];
        $('new-name').value = ''; $('new-cost').value = ''; $('new-emoji').value = '🎁';
        $('new-emoji-view').textContent = '🎁';
        dropPhoto();
        renderShop();
        toast(t(saved.url ? 'rewards.addedWithPhoto' : 'rewards.added'));
      } catch (e) {
        console.error(e); toast(t('rewards.addFailed'));
        showError(t('rewards.addFailedWhere'), e);
      }
      finally { $('btn-add').disabled = false; }
    };

    // ── Старт: только для родителя ──
    (async () => {
      const user = await initAuth();
      if (!user || !currentUid()) { location.href = 'index.html'; return; }
      const families = await listMyFamilies();
      fid = resolveActiveFamily(families) || getActiveFamilyId();
      if (!fid) { showError(t('rewards.noFamily'), { code: 'no-family', message: t('rewards.noFamilyMsg') }); return; }
      // Родительская часть под кодом: если он задан, а в этой сессии его не
      // вводили — отправляем на главную, там спросят. Замок от ребёнка, не от взлома.
      const settings = await getSettings(fid).catch(() => null);
      applyFamilyLang(settings); applyI18n();
      if (parentAreaLocked(settings) && !isParentUnlocked()) { location.href = 'index.html'; return; }
      // Витрина, которая не прочиталась, и витрина пустая — разные вещи:
      // молчаливое «пока пусто» отправляло чинить не то.
      try { shop = await listRealRewards(fid); } catch (e) { console.warn('shop:', e); showError(t('rewards.shopFailed'), e); }
      renderShop();
      try { children = await listAllRewards(fid); } catch (e) { console.warn('children:', e); }
      renderQueue();
      setReady(true);
    })();
  </script>
  <script src="pwa.js"></script>
</body>
</html>
